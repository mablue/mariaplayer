name: build
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      tag:    ${{ steps.meta.outputs.tag }}
      ver:    ${{ steps.meta.outputs.ver }}
      apk:    ${{ steps.meta.outputs.apk }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      size:   ${{ steps.meta.outputs.size }}
      sha:    ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # SDK cache removed (C31). Data from 10 prior runs showed:
      #   • cache restore: 5-13 s
      #   • cache save:    1-3 s
      #   • "Install SDK": 2-3 s regardless of cache (runner pre-installs)
      #   Net result: +10-15 s per run with zero savings, plus tar noise
      # from NDK/python files that sdkmanager never touches. Gradle
      # dependency caching (gradle/actions below) is untouched and works.
      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/mariaplayer.jks"
          stat -c%s "$RUNNER_TEMP/keystore/mariaplayer.jks"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --build-cache --stacktrace

      - name: Build release APK
        env:
          VERSION_CODE:  ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/mariaplayer.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
        run: ./gradlew :app:assembleRelease --no-daemon --build-cache --stacktrace

      - name: Package + metadata
        id: meta
        run: |
          set -euo pipefail
          VER="0.1.${VERSION_CODE:-1}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VER}-build.${{ github.run_number }}-${SHA}"
          APK="mariaplayer-${VER}-${SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # NOTE: upload-artifact removed. APK is published to GitHub Releases
      # (separate storage, no 500MB Actions quota) below.

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "MariaPlayer ${{ steps.meta.outputs.tag }}"
          files: ${{ steps.meta.outputs.apk }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Version: ${{ steps.meta.outputs.ver }}
            Size: ${{ steps.meta.outputs.size }} bytes
            SHA-256: ${{ steps.meta.outputs.sha256 }}
