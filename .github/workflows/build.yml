name: build
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      tag:    ${{ steps.meta.outputs.tag }}
      ver:    ${{ steps.meta.outputs.ver }}
      apk:    ${{ steps.meta.outputs.apk }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      size:   ${{ steps.meta.outputs.size }}
      sha:    ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/mariaplayer.jks"
          stat -c%s "$RUNNER_TEMP/keystore/mariaplayer.jks"
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build release APK
        env:
          VERSION_CODE:  ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/mariaplayer.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Package + metadata
        id: meta
        run: |
          set -euo pipefail
          # versionName uses Kotlin interpolation; use VERSION_CODE env
          VER="0.1.${VERSION_CODE:-1}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VER}-build.${{ github.run_number }}-${SHA}"
          APK="mariaplayer-${VER}-${SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mariaplayer-release
          path: ${{ steps.meta.outputs.apk }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "MariaPlayer ${{ steps.meta.outputs.tag }}"
          files: ${{ steps.meta.outputs.apk }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Version: ${{ steps.meta.outputs.ver }}
            Size: ${{ steps.meta.outputs.size }} bytes
            SHA-256: ${{ steps.meta.outputs.sha256 }}
  update-readme:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update README
        env:
          TAG:    ${{ needs.apk.outputs.tag }}
          VER:    ${{ needs.apk.outputs.ver }}
          APK:    ${{ needs.apk.outputs.apk }}
          SHA256: ${{ needs.apk.outputs.sha256 }}
          SIZE:   ${{ needs.apk.outputs.size }}
          SHA:    ${{ needs.apk.outputs.sha }}
          REPO:   ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          tag, ver = os.environ["TAG"], os.environ["VER"]
          apk, sha256 = os.environ["APK"], os.environ["SHA256"]
          size, sha, repo = os.environ["SIZE"], os.environ["SHA"], os.environ["REPO"]
          url = f"https://github.com/{repo}/releases/tag/{tag}"
          dl  = f"https://github.com/{repo}/releases/latest/download/{apk}"
          block = (
              "<!-- LATEST-BUILD:start -->\n"
              "| Field | Value |\n"
              "|---|---|\n"
              f"| Release | [{tag}]({url}) |\n"
              f"| Version | {ver} |\n"
              f"| Commit | {sha} |\n"
              f"| APK | [{apk}]({dl}) |\n"
              f"| Size | {size} bytes |\n"
              f"| SHA-256 | {sha256} |\n"
              "<!-- LATEST-BUILD:end -->"
          )
          p = pathlib.Path("README.md")
          s = p.read_text()
          if "<!-- LATEST-BUILD:start -->" not in s:
              s += "\n\n<!-- LATEST-BUILD:start -->\n<!-- LATEST-BUILD:end -->\n"
          s = re.sub(r"<!-- LATEST-BUILD:start -->.*?<!-- LATEST-BUILD:end -->",
                     lambda _m: block, s, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then exit 0; fi
          git add README.md
          git commit -m "docs: update latest-build [skip ci]"
          git push
