name: build
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK (skip removed 'tools' package)
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install platform + build-tools
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Ensure gradlew executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mariaplayer-debug
          path: app/build/outputs/apk/debug/*.apk
