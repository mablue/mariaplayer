name: build
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      tag:    ${{ steps.meta.outputs.tag }}
      ver:    ${{ steps.meta.outputs.ver }}
      apk:    ${{ steps.meta.outputs.apk }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      size:   ${{ steps.meta.outputs.size }}
      sha:    ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Package + metadata
        id: meta
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VER}-build.${{ github.run_number }}-${SHA}"
          APK="mariaplayer-${VER}-${SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          {
            echo "tag=$TAG"
            echo "ver=$VER"
            echo "code=$CODE"
            echo "apk=$APK"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mariaplayer-debug
          path: ${{ steps.meta.outputs.apk }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "MariaPlayer ${{ steps.meta.outputs.tag }}"
          files: ${{ steps.meta.outputs.apk }}
          body: |
            Automated build from commit `${{ github.sha }}`.

            | Field | Value |
            |---|---|
            | Version | ${{ steps.meta.outputs.ver }} (code ${{ steps.meta.outputs.code }}) |
            | Commit | `${{ steps.meta.outputs.sha }}` |
            | Size | ${{ steps.meta.outputs.size }} bytes |
            | SHA-256 | `${{ steps.meta.outputs.sha256 }}` |

            Install: download the APK, tap it, allow "Install from unknown sources".

  update-readme:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update README latest-build block
        env:
          TAG:    ${{ needs.apk.outputs.tag }}
          VER:    ${{ needs.apk.outputs.ver }}
          APK:    ${{ needs.apk.outputs.apk }}
          SHA256: ${{ needs.apk.outputs.sha256 }}
          SIZE:   ${{ needs.apk.outputs.size }}
          SHA:    ${{ needs.apk.outputs.sha }}
          REPO:   ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          tag    = os.environ["TAG"];    ver    = os.environ["VER"]
          apk    = os.environ["APK"];    sha256 = os.environ["SHA256"]
          size   = os.environ["SIZE"];   sha    = os.environ["SHA"]
          repo   = os.environ["REPO"]
          url = f"https://github.com/{repo}/releases/tag/{tag}"
          dl  = f"https://github.com/{repo}/releases/latest/download/{apk}"
          block = (
              "<!-- LATEST-BUILD:start -->\n"
              "| Field | Value |\n"
              "|---|---|\n"
              f"| Release | [{tag}]({url}) |\n"
              f"| Version | {ver} |\n"
              f"| Commit | `{sha}` |\n"
              f"| APK | [{apk}]({dl}) |\n"
              f"| Size | {size} bytes |\n"
              f"| SHA-256 | `{sha256}` |\n"
              "<!-- LATEST-BUILD:end -->"
          )
          p = pathlib.Path("README.md")
          s = p.read_text()
          if "<!-- LATEST-BUILD:start -->" not in s:
              s += "\n\n<!-- LATEST-BUILD:start -->\n<!-- LATEST-BUILD:end -->\n"
          s = re.sub(
              r"<!-- LATEST-BUILD:start -->.*?<!-- LATEST-BUILD:end -->",
              lambda _m: block, s, flags=re.S,
          )
          p.write_text(s)
          print("README updated")
          PY
      - name: Commit README (skip CI)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "no README change"
            exit 0
          fi
          git add README.md
          git commit -m "docs: update latest-build block [skip ci]"
          git push
